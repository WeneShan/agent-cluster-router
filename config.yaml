router:
  host: "0.0.0.0"
  port: 8000

clusters:
  openclaw:
    - name: oc-mock-1
      base_url: http://127.0.0.1:8082
      capability: ["tool-heavy", "stable"]
      weight: 10
      healthy: true
      backend: openclaw-mock
  hermes:
    - name: hm-1
      base_url: http://127.0.0.1:8081
      capability: ["planning", "fast"]
      weight: 10
      healthy: true

health_check:
  interval_seconds: 10
  failure_threshold: 3

routing:
  default_strategy: "weighted"
  canary:
    hermes_ratio: 1.0
