[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Custom markers for test layering
markers =
    unit: Fast tests — no server, no network, no I/O. Run first in CI.
    integration: Medium tests — use TestClient, need FastAPI app loaded. No real backends.
    e2e: End-to-end tests — need real server + backends running. Slow, skipped in CI by default.
    slow: Tests that take >5 seconds. Skipped in fast mode.

# Default: run unit + integration, skip e2e
addopts =
    -v
    --strict-markers
    --tb=short
    -m "not e2e"
    --ignore=venv
