# Commander Mode — 提问分流策略
# 定义哪些问题 Hermes 可以自己回答，哪些必须转给用户

hermes_can_answer:
  - filename                    # 文件命名
  - code_style                  # 代码风格
  - type_hint                   # 类型提示
  - formatting                  # 格式化
  - directory_structure         # 目录结构
  - minor_implementation_detail # 次要实现细节
  - naming_convention           # 命名规范
  - error_handling_style        # 错误处理风格
  - test_structure              # 测试结构
  - docstring_format            # 文档字符串格式
  - import_organization         # 导入组织
  - config_format               # 配置格式

ask_user:
  - database_choice             # 数据库选型
  - authentication_strategy     # 认证策略
  - deployment_target           # 部署目标
  - payment_provider            # 支付提供商
  - architecture_split          # 架构分拆决策
  - data_privacy                # 数据隐私
  - business_rule               # 业务规则
  - third_party_service         # 第三方服务选型
  - infrastructure_choice       # 基础设施选择
  - team_structure              # 团队结构
  - budget_constraint           # 预算约束
  - timeline_decision           # 时间线决策
  - compliance_requirement      # 合规要求
